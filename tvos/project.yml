# XcodeGen spec for the tvOS app. Generate the project with: xcodegen generate
# The NuvioShared framework must be built first: ./gradlew -p shared assembleNuvioSharedReleaseXCFramework
name: NuvioTV
options:
  bundleIdPrefix: com.nuvio
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
packages:
  # mpv + FFmpeg + libass + libplacebo/MoltenVK (LGPL build). Plays MKV, ASS/SSA, HEVC/AV1, HDR/DV.
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 1.0.0
  # HTML parsing for the plugins' cheerio bridge (Jsoup on Android).
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    exactVersion: 2.8.7
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  NuvioTV:
    type: application
    platform: tvOS
    sources:
      - path: NuvioTV
        excludes:
          - Info.plist
          - Resources
      - path: NuvioTV/Resources
        buildPhase: resources
      - path: Config
        buildPhase: none
    info:
      path: NuvioTV/Info.plist
      properties:
        CFBundleDisplayName: Nuvio
        UIUserInterfaceStyle: Dark
        UIRequiredDeviceCapabilities: [arm64]
        # Add-ons and debrid/CDN streams are frequently plain HTTP.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Filled from Config/Secrets.xcconfig (same keys as the Android local.properties).
        NuvioTmdbApiKey: $(NUVIO_TMDB_API_KEY)
        NuvioTraktClientId: $(NUVIO_TRAKT_CLIENT_ID)
        NuvioTraktClientSecret: $(NUVIO_TRAKT_CLIENT_SECRET)
        NuvioSimklClientId: $(NUVIO_SIMKL_CLIENT_ID)
        NuvioSimklAppName: $(NUVIO_SIMKL_APP_NAME)
        NuvioMdbListClientId: $(NUVIO_MDBLIST_CLIENT_ID)
        NuvioAniListClientId: $(NUVIO_ANILIST_CLIENT_ID)
        NuvioPremiumizeClientId: $(NUVIO_PREMIUMIZE_CLIENT_ID)
        NuvioIntroDbApiUrl: $(NUVIO_INTRODB_API_URL)
        NuvioTrailerApiUrl: $(NUVIO_TRAILER_API_URL)
        NuvioSupabaseUrl: $(NUVIO_SUPABASE_URL)
        NuvioSupabaseAnonKey: $(NUVIO_SUPABASE_ANON_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nuvio.tv.appletv
        PRODUCT_NAME: NuvioTV
        TARGETED_DEVICE_FAMILY: "3"
        # Kotlin/Native only builds arm64 simulator slices (Apple silicon).
        "EXCLUDED_ARCHS[sdk=appletvsimulator*]": x86_64
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - framework: ../shared/build/XCFrameworks/release/NuvioShared.xcframework
        embed: true
        codeSign: true
      - package: MPVKit
        product: MPVKit
      - package: SwiftSoup
    scheme:
      testTargets: []

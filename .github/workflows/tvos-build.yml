name: Build tvOS App

on:
  push:
    paths:
      - "shared/**"
      - "tvos/**"
      - "gradle/libs.versions.toml"
      - ".github/workflows/tvos-build.yml"
  pull_request:
    paths:
      - "shared/**"
      - "tvos/**"
      - "gradle/libs.versions.toml"
      - ".github/workflows/tvos-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tvos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Shared core + tvOS app
    # Same runner as NuvioMobile's iOS build (GitHub's macos-15 arm64 pool often never picks jobs up).
    # Override with the repository variables TVOS_RUNNER / XCODE_DEVELOPER_DIR.
    runs-on: ${{ vars.TVOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 120
    env:
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      PREFERRED_DEVELOPER_DIR: ${{ vars.XCODE_DEVELOPER_DIR || '/Applications/Xcode_27.1.app/Contents/Developer' }}
      LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 || secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          if [[ -d "${PREFERRED_DEVELOPER_DIR}" ]]; then
            echo "DEVELOPER_DIR=${PREFERRED_DEVELOPER_DIR}" >> "$GITHUB_ENV"
          else
            echo "::notice::${PREFERRED_DEVELOPER_DIR} not found; using the runner's default Xcode."
            ls -d /Applications/Xcode*.app 2>/dev/null || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk appletvos --show-sdk-version
          xcrun --sdk appletvsimulator --show-sdk-version

      - name: Constrain Gradle / Kotlin Native memory for the hosted runner
        run: |
          gradle_user_home="${GRADLE_USER_HOME:-${HOME}/.gradle}"
          mkdir -p "${gradle_user_home}"
          {
            echo "org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M -XX:+UseG1GC"
            echo "kotlin.daemon.jvmargs=-Xmx1024M"
            echo "kotlin.native.jvmArgs=-Xmx6144M -XX:+UseG1GC"
            echo "org.gradle.workers.max=2"
            echo "kotlin.native.disableCompilerDaemon=true"
          } >> "${gradle_user_home}/gradle.properties"

      - name: Configure API keys
        run: |
          if [[ -n "${LOCAL_PROPERTIES_BASE64}" ]]; then
            printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > "${RUNNER_TEMP}/local.properties"
            ./tvos/scripts/write-secrets.sh "${RUNNER_TEMP}/local.properties"
            rm -f "${RUNNER_TEMP}/local.properties"
          else
            echo "::notice::No LOCAL_PROPERTIES_BASE64 secret; building without TMDB/Trakt/Simkl/… keys."
          fi

      - name: Test shared core (JVM)
        run: ./gradlew -p shared jvmTest --no-daemon

      - name: Build NuvioShared.xcframework
        run: ./gradlew -p shared assembleNuvioSharedReleaseXCFramework --no-daemon

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          cd tvos
          xcodegen generate

      - name: Build for tvOS Simulator
        working-directory: tvos
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project NuvioTV.xcodeproj \
            -scheme NuvioTV \
            -configuration Debug \
            -sdk appletvsimulator \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath build/sim \
            -clonedSourcePackagesDirPath build/spm \
            CODE_SIGNING_ALLOWED=NO | tee build/xcodebuild-sim.log | grep -E "error:|warning: .*NuvioTV/|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/sim/Build/Products/Debug-appletvsimulator/NuvioTV.app

      - name: Build for Apple TV device (unsigned)
        working-directory: tvos
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project NuvioTV.xcodeproj \
            -scheme NuvioTV \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build/device \
            -clonedSourcePackagesDirPath build/spm \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild-device.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          APP=build/device/Build/Products/Release-appletvos/NuvioTV.app
          test -d "$APP"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../NuvioTV-unsigned.ipa Payload)

      - name: Upload simulator app
        uses: actions/upload-artifact@v7
        with:
          name: NuvioTV-tvOS-simulator
          path: tvos/build/sim/Build/Products/Debug-appletvsimulator/NuvioTV.app
          if-no-files-found: error

      - name: Upload unsigned device IPA
        uses: actions/upload-artifact@v7
        with:
          name: NuvioTV-tvOS-unsigned-ipa
          path: tvos/build/NuvioTV-unsigned.ipa
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tvos-build-logs
          path: tvos/build/*.log
          if-no-files-found: ignore
